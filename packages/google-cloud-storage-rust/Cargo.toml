[package]
name = "google_cloud_storage_rust"
version = "0.1.0"
edition = "2021"
description = "Rust-backed Google Cloud Storage client for Python (BidiRead, BidiWrite, ListObjects) with PyO3"
license = "Apache-2.0"
publish = false

[lib]
name = "_rust_core"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
google-cloud-storage = "1.20"
google-cloud-gax = "1"
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(google_cloud_unstable_storage_bidi)"] }

